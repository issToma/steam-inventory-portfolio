services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.1-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invinv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invinv}
      POSTGRES_DB: ${POSTGRES_DB:-invinv}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      INVINV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-invinv}:${POSTGRES_PASSWORD:-invinv}@postgres:5432/${POSTGRES_DB:-invinv}
      # Inside the container the app always listens on 8080; APP_HOST_PORT picks the host side.
      INVINV_PORT: "8080"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
