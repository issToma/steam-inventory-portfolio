services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.1-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs2market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2market}
      POSTGRES_DB: ${POSTGRES_DB:-cs2market}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      CS2M_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cs2market}:${POSTGRES_PASSWORD:-cs2market}@postgres:5432/${POSTGRES_DB:-cs2market}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
