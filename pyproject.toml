[project]
name = "invinv"
version = "0.1.0"
description = "InvInv (Investment Inventory): self-hosted tracker of what your Steam items are worth on the Steam Community Market"
readme = "README.md"
license = "MIT"
authors = [{ name = "Valery" }]
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=46",
    "fastapi>=0.162.0",
    "nicegui>=3.18.0",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
invinv = "invinv.main:run"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "PTH"]
# Cyrillic letters appear in real Steam price strings such as "2582,16 руб.".
allowed-confusables = ["р", "у", "б"]

[tool.ruff.lint.per-file-ignores]
# Russian translations: Cyrillic letters and long sentences are expected.
"src/invinv/i18n.py" = ["RUF001", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]
